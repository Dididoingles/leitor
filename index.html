<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Leitor Interativo — Aprenda a pronúncia de qualquer frase em inglês. Ouça, repita e receba uma nota instantânea.">
  <title>Leitor Interativo</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-surface: rgba(255, 255, 255, 0.05);
      --color-border: rgba(255, 255, 255, 0.12);
      --color-accent: #c20000;
      --color-text: #ffffff;
      --color-text-dim: rgba(255, 255, 255, 0.72);
      --color-text-muted: rgba(255, 255, 255, 0.55);
      --color-success: #4ade80;
      --font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --tracking-tight: -0.02em;
      --tracking-tighter: -0.045em;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }

    body {
      font-family: var(--font-family);
      background: radial-gradient(circle at 50% 0%, #1a0505 0%, #0a0a0a 55%);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* ==========================================
       BADGE FIXO NO CANTO
       ========================================== */
    .corner-badge {
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--color-text-muted);
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--color-border);
      border-radius: 999px;
      animation: fadeIn 0.8s var(--ease-out) 0.4s both;
    }

    .corner-badge__dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--color-success);
      box-shadow: 0 0 6px var(--color-success);
      animation: pulse 2s ease-in-out infinite;
    }

    /* ==========================================
       GLOW
       ========================================== */
    .welcome-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(194, 0, 0, 0.22) 0%, transparent 65%);
      filter: blur(40px);
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
    }

    /* ==========================================
       ONDAS
       ========================================== */
    .wave-bg {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 200px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      padding: 0 2%;
      pointer-events: none;
      opacity: 0.32;
      mask-image: linear-gradient(to top, #000 15%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, #000 15%, transparent 100%);
    }

    .wave-bg span {
      flex: 1 1 0;
      min-width: 2px;
      max-width: 10px;
      min-height: 6px;
      border-radius: 3px;
      background: linear-gradient(to top, var(--color-accent), transparent);
      animation: waveBar 2.4s ease-in-out infinite;
      transform-origin: bottom;
    }

    /* ==========================================
       LAYOUT PRINCIPAL
       ========================================== */
    .welcome-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-5);
      animation: fadeInUp 0.7s var(--ease-out) 0.2s both;
    }

    /* ==========================================
       HERO: DISCO DE VINIL GIRANDO
       ========================================== */
    .welcome-icon {
      order: -1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(194,0,0,0.12), rgba(255,255,255,0.03));
      border: 1px solid rgba(194, 0, 0, 0.2);
      box-shadow: 0 0 40px rgba(194, 0, 0, 0.25), inset 0 0 20px rgba(194, 0, 0, 0.1);
      flex-shrink: 0;
      animation: floatIcon 3s ease-in-out infinite;
    }

    .vinyl {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 0.5px,
          transparent 0.5px,
          transparent 3px
        );
      animation: spinVinyl 4s linear infinite;
    }

    .vinyl svg {
      width: 36px;
      height: 36px;
      color: var(--color-accent);
      filter: drop-shadow(0 0 6px rgba(194, 0, 0, 0.5));
      stroke-width: 1;
    }

    .vinyl svg * {
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .vinyl__hole {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--color-bg);
      box-shadow: 0 0 0 0.5px rgba(255,255,255,0.12);
    }

    /* ==========================================
       BLOCO DE TEXTO
       ========================================== */
    .welcome-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
      width: 100%;
    }

    .welcome-brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-dim);
      letter-spacing: var(--tracking-tight);
      padding: 4px 0;
    }

    .welcome-brand svg {
      width: 18px;
      height: 18px;
      color: var(--color-accent);
    }

    .welcome-title {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: var(--tracking-tighter);
      text-wrap: balance;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ff2b2b 0%, #c20000 50%, #ff6b6b 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s ease infinite;
    }

    .welcome-desc {
      font-size: var(--text-sm);
      color: var(--color-text-dim);
      line-height: 1.6;
      max-width: 34ch;
      text-wrap: pretty;
    }

    .welcome-author {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }
    .welcome-author strong { color: var(--color-text); font-weight: 500; }

    /* ---------- BOTÃO ---------- */
    .btn-start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: 44px;
      width: 100%;
      max-width: 220px;
      padding: 0 var(--space-5);
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 500;
      color: #fff;
      background: var(--color-accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(194, 0, 0, 0.35);
      transition: all 180ms ease;
      text-decoration: none;
    }
    .btn-start:hover { background: #e00000; transform: translateY(-1px); box-shadow: 0 10px 32px rgba(224, 0, 0, 0.5); }
    .btn-start:active { transform: translateY(0); }
    .btn-start svg { width: 18px; height: 18px; }

    .welcome-hint {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      animation: fadeIn 1s var(--ease-out) 1.2s both;
    }
    .welcome-hint kbd {
      display: inline-block;
      padding: 2px 7px;
      font-family: var(--font-family);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--color-text-dim);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-bottom-width: 2px;
      border-radius: 5px;
      margin: 0 2px;
    }

    /* ==========================================
       DESKTOP
       ========================================== */
    @media (min-width: 768px) {
      .welcome-content {
        max-width: 900px;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: clamp(32px, 6vw, 80px);
        text-align: left;
      }

      .welcome-icon {
        order: 0;
        width: 150px;
        height: 150px;
        justify-self: end;
      }

      .vinyl {
        width: 120px;
        height: 120px;
      }

      .vinyl svg {
        width: 72px;
        height: 72px;
      }

      .vinyl__hole {
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
      }

      .welcome-text {
        align-items: flex-start;
        gap: var(--space-5);
      }

      .welcome-brand {
        font-size: var(--text-base);
      }
      .welcome-brand svg {
        width: 22px;
        height: 22px;
      }

      .welcome-title {
        font-size: clamp(2rem, 3.2vw, 2.75rem);
        line-height: 1.15;
        letter-spacing: var(--tracking-tighter);
      }

      .welcome-desc {
        font-size: var(--text-base);
        max-width: 48ch;
      }

      .btn-start {
        height: 52px;
        max-width: 260px;
        margin: 0;
      }
    }

    /* ==========================================
       KEYFRAMES
       ========================================== */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes waveBar {
      0%, 100% { height: calc(var(--h) * 0.4); opacity: 0.6; }
      50%      { height: var(--h);          opacity: 1;   }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    @keyframes spinVinyl {
      to { transform: rotate(360deg); }
    }

    /* ==========================================
       REDUCED MOTION
       ========================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .wave-bg, .welcome-glow { display: none; }
      .vinyl { animation: none; }
    }
  </style>
</head>
<body>

  <div class="corner-badge">
    <span class="corner-badge__dot"></span>
    Ferramenta gratuita
  </div>

  <div class="wave-bg" id="wave-bg" aria-hidden="true"></div>

  <div class="welcome-glow" aria-hidden="true"></div>

  <main class="welcome-content">

    <div class="welcome-icon">
      <div class="vinyl">
        <i data-lucide="disc-3" aria-hidden="true"></i>
        <span class="vinyl__hole" aria-hidden="true"></span>
      </div>
    </div>

    <div class="welcome-text">

      <div class="welcome-brand">
        <i data-lucide="audio-lines" aria-hidden="true"></i>
        <span>Leitor Interativo</span>
      </div>

      <h1 class="welcome-title">
        Aprenda a <span class="gradient-text">pronúncia</span>
        de qualquer frase em Inglês
      </h1>

      <p class="welcome-desc">
        Ouça, repita e receba uma nota instantânea da sua pronúncia.
        Estude com qualquer material, de graça.
      </p>

      <span class="welcome-author">
        Desenvolvido por <strong>@dicarvalho.prof</strong>
      </span>

      <!-- Link direto para a pasta /leitor/ -->
      <a class="btn-start" id="btn-start" href="home/">
        Começar agora
        <i data-lucide="arrow-right" aria-hidden="true"></i>
      </a>

      <span class="welcome-hint">Pressione <kbd>Enter</kbd> para iniciar</span>
    </div>
  </main>

  <script>
    lucide.createIcons();

    (function buildWave() {
      const container = document.getElementById('wave-bg');
      const count = Math.max(28, Math.floor(window.innerWidth / 18));
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const bar = document.createElement('span');
        const h = 25 + Math.random() * 75;
        const delay = (Math.random() * 2.4).toFixed(2);
        bar.style.setProperty('--h', h + '%');
        bar.style.animationDelay = delay + 's';
        frag.appendChild(bar);
      }
      container.appendChild(frag);
    })();

    // Enter leva para /leitor/
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.repeat) {
        window.location.href = 'leitor/';
      }
    });
  </script>
</body>
</html>
